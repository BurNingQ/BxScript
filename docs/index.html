<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BxScript Documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<!--    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/theme-defaults.css">-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-defaults.css">
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'BxScript',
        repo: 'https://github.com/BurNingQ/BxScript',
        loadSidebar: true,
        subMaxLevel: 2,
        copyCode: {
            buttonText: '复制',
            errorText: '错误',
            successText: '已复制'
        },
        search: {
            placeholder: '🔍 搜索 API...',
            noData: '😒 找不到结果',
            depth: 6
        }
    }
</script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
